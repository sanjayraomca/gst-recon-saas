version: '3.8'

services:
  # ==================== NETWORK & PROXY ====================
  
  traefik:
    image: traefik:latest
    container_name: gst-traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8088"
      - "--accesslog=true"
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "8088:8088"      # Web traffic
      - "8085:8080"      # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gst-network

  # ==================== DATABASES ====================
  
  # Main PostgreSQL for GST Recon
  postgres-main:
    image: postgres:15-alpine
    container_name: gst-postgres-main
    environment:
      POSTGRES_DB: ${POSTGRES_MAIN_DB}
      POSTGRES_USER: ${POSTGRES_MAIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - gst-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Keycloak
  postgres-keycloak:
    image: postgres:15-alpine
    container_name: gst-postgres-keycloak
    environment:
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - gst-network

  # PostgreSQL for Kong
  postgres-kong:
    image: postgres:15-alpine
    container_name: gst-postgres-kong
    environment:
      POSTGRES_DB: ${POSTGRES_KONG_DB}
      POSTGRES_USER: ${POSTGRES_KONG_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KONG_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_kong_data:/var/lib/postgresql/data
    networks:
      - gst-network

  # ==================== AUTHENTICATION ====================
  
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: gst-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${POSTGRES_KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      KC_HOSTNAME: keycloak.gst.local
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/gsttool-realm.json:/opt/keycloak/data/import/gsttool-realm.json:ro
    depends_on:
      - postgres-keycloak
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.gst.local`)"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  # ==================== API GATEWAY ====================
  
  kong-migrations:
    image: kong:3.3
    container_name: gst-kong-migrations
    command: kong migrations bootstrap
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_USER: ${POSTGRES_KONG_USER}
      KONG_PG_PASSWORD: ${POSTGRES_KONG_PASSWORD}
      KONG_PG_DATABASE: ${POSTGRES_KONG_DB}
    depends_on:
      - postgres-kong
    networks:
      - gst-network
    restart: on-failure

  kong:
    image: kong:3.3
    container_name: gst-kong
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong
      KONG_PG_USER: ${POSTGRES_KONG_USER}
      KONG_PG_PASSWORD: ${POSTGRES_KONG_PASSWORD}
      KONG_PG_DATABASE: ${POSTGRES_KONG_DB}
      KONG_PROXY_LISTEN: 0.0.0.0:8002      # Changed from 8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8003      # Changed from 8001
      KONG_PLUGINS: bundled,jwt
      KONG_LOG_LEVEL: info
    ports:
      - "8002:8002"  # Proxy (changed from 8000)
      - "8003:8003"  # Admin API (changed from 8001)
    depends_on:
      - kong-migrations
      - postgres-kong
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kong.rule=Host(`api.gst.local`)"
      - "traefik.http.services.kong.loadbalancer.server.port=8002"

  # ==================== STORAGE & CACHE ====================
  
  # redis:
  #   image: redis:7-alpine
  #   container_name: gst-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - gst-network

  minio:
    image: minio/minio:latest
    container_name: gst-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
    command: server /data --console-address ":9001"
    ports:
      - "9090:9000"  # S3 API (changed to avoid Portainer conflict)
      - "9091:9001"  # Console UI
    volumes:
      - minio_data:/data
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.gst.local`)"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"

  # rabbitmq:
  #   image: rabbitmq:3.12-management-alpine
  #   container_name: gst-rabbitmq
  #   environment:
  #     RABBITMQ_DEFAULT_USER: rabbitadmin
  #     RABBITMQ_DEFAULT_PASS: RabbitAdmin123
  #   ports:
  #     - "5672:5672"    # AMQP
  #     - "15673:15672"  # Management UI (changed port)
  #   volumes:
  #     - rabbitmq_data:/var/lib/rabbitmq
  #   networks:
  #     - gst-network
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.gst.local`)"
  #     - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  nats:
    image: nats:2.10
    container_name: gst-nats
    command: -js -m 8222
    ports:
      - "4222:4222"  # NATS client
      - "8222:8222"  # Monitoring
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nats.rule=Host(`nats.gst.local`)"
      - "traefik.http.services.nats.loadbalancer.server.port=8222"

  # ==================== EMAIL TESTING ====================
  
  mailhog:
    image: mailhog/mailhog:latest
    container_name: gst-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailhog.rule=Host(`mailhog.gst.local`)"
      - "traefik.http.services.mailhog.loadbalancer.server.port=8025"

  # ==================== MICROSERVICES ====================
  
  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-services/Dockerfile
    container_name: gst-tenant-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - NATS_URL=nats://nats:4222
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=gsttool
      - KEYCLOAK_CLIENT_ID=admin-api
      - KEYCLOAK_CLIENT_SECRET=admin-api-secret-change-in-production
      - JWT_SECRET=change-this-secret-in-production
      # - RECAPTCHA_SECRET_KEY=... (disabled for e2e tests)
      - FRONTEND_URL=http://localhost:3000
    command: npm run dev
    volumes:
      - ./services/tenant-services/src:/app/services/tenant-services/src
      - ./services/shared:/app/services/shared
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tenant-service.rule=PathPrefix(`/auth`) || PathPrefix(`/tenants`)"
      - "traefik.http.services.tenant-service.loadbalancer.server.port=3001"
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  workspace-service:
    build:
      context: .
      dockerfile: services/workspace-service/Dockerfile
    container_name: gst-workspace-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=gsttool
      - KEYCLOAK_CLIENT_ID=admin-api
      - KEYCLOAK_CLIENT_SECRET=admin-api-secret-change-in-production
      - NATS_URL=nats://nats:4222
      - PORT=3002
      - EXT_API_URL=http://gsp_api_app:3015
    command: npm run dev
    volumes:
      - ./services/workspace-service/src:/app/services/workspace-service/src
      - ./services/shared:/app/services/shared
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.workspace-service.rule=PathPrefix(`/workspaces`) || PathPrefix(`/purchase-invoices`) || PathPrefix(`/gstr2b-invoices`) || PathPrefix(`/reconciliation`) || PathPrefix(`/states`) || PathPrefix(`/suppliers`) || PathPrefix(`/connectors`)"
      - "traefik.http.services.workspace-service.loadbalancer.server.port=3002"
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  gstn-service:
    build:
      context: .
      dockerfile: services/gstn-service/Dockerfile
    container_name: gst-gstn-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "3003:3003"
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - NATS_URL=nats://nats:4222
      - PORT=3003
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gstn-service.rule=PathPrefix(`/gstins`)"
      - "traefik.http.services.gstn-service.loadbalancer.server.port=3003"
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  upload-service:
    build:
      context: .
      dockerfile: services/upload-service/Dockerfile
    container_name: gst-upload-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "3004:3004"
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - NATS_URL=nats://nats:4222
      - PORT=3004
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_USE_SSL=false
      - MINIO_BUCKET=gst-documents
    command: npm run dev
    volumes:
      - ./uploads:/app/uploads
      - ./services/upload-service/src:/app/services/upload-service/src
      - ./services/shared:/app/services/shared
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.upload-service.rule=PathPrefix(`/uploads`) || PathPrefix(`/gst-import`)"
      - "traefik.http.services.upload-service.loadbalancer.server.port=3004"
      # Increase body size limit to 50MB to allow large file uploads
      - "traefik.http.routers.upload-service.middlewares=upload-buffering"
      - "traefik.http.middlewares.upload-buffering.buffering.maxRequestBodyBytes=52428800"
      - "traefik.http.middlewares.upload-buffering.buffering.memRequestBodyBytes=52428800"
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  report-service:
    build:
      context: .
      dockerfile: services/report-services/Dockerfile
    container_name: gst-report-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "3005:3005"
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - NATS_URL=nats://nats:4222
      - PORT=3005
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.report-service.rule=PathPrefix(`/reports`) || PathPrefix(`/analytics`)"
      - "traefik.http.services.report-service.loadbalancer.server.port=3005"
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  json-import-service:
    build:
      context: .
      dockerfile: services/json-import-service/Dockerfile
    container_name: gst-json-import-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "3007:3007"
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - NATS_URL=nats://nats:4222
      - PORT=3007
    command: npm run dev
    volumes:
      - ./services/json-import-service/src:/app/services/json-import-service/src
      - ./services/shared:/app/services/shared
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.json-import-service.rule=PathPrefix(`/json-import`)"
      - "traefik.http.services.json-import-service.loadbalancer.server.port=3007"
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3007/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s



  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: gst-notification-service
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      mailhog:
        condition: service_started
    ports:
      - "3006:3006"
    environment:
      - NATS_URL=nats://nats:4222
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - PORT=3006
    command: npm run dev
    volumes:
      - ./services/notification/src:/app/services/notification/src
      - ./services/shared:/app/services/shared
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification-service.rule=PathPrefix(`/notifications`)"
      - "traefik.http.services.notification-service.loadbalancer.server.port=3006"
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ../recon_frontend
      dockerfile: Dockerfile
      target: build-stage
    container_name: gst-frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ../recon_frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`app.gst.local`)"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ==================== TOOLS ====================
  
  adminer:
    image: adminer:4
    container_name: gst-adminer
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-main
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adminer.rule=Host(`adminer.gst.local`)"
      - "traefik.http.services.adminer.loadbalancer.server.port=8080"


volumes:
  postgres_main_data:
  postgres_keycloak_data:
  postgres_kong_data:
  # redis_data:
  minio_data:
  # rabbitmq_data:

networks:
  gst-network:
    driver: bridge