
services:
  # ==================== NETWORK & PROXY ====================
  
  traefik:
    image: traefik:v2.10
    container_name: gst-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global Redirect HTTP to HTTPS
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # ACME SSL configuration
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--accesslog=true"
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "80:80"          # HTTP traffic
      - "443:443"        # HTTPS traffic
      - "8085:8080"      # Traefik dashboard (kept open for admin console, secure/firewall in prod)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - gst-network

  # ==================== DATABASES ====================
  
  # Main PostgreSQL for GST Recon
  postgres-main:
    image: postgres:15-alpine
    container_name: gst-postgres-main
    environment:
      POSTGRES_DB: ${POSTGRES_MAIN_DB}
      POSTGRES_USER: ${POSTGRES_MAIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MAIN_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - gst-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for Keycloak
  postgres-keycloak:
    image: postgres:15-alpine
    container_name: gst-postgres-keycloak
    environment:
      POSTGRES_DB: ${POSTGRES_KEYCLOAK_DB}
      POSTGRES_USER: ${POSTGRES_KEYCLOAK_USER}
      POSTGRES_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql/data
    networks:
      - gst-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== AUTHENTICATION ====================
  
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: gst-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${POSTGRES_KEYCLOAK_DB}
      KC_DB_USERNAME: ${POSTGRES_KEYCLOAK_USER}
      KC_DB_PASSWORD: ${POSTGRES_KEYCLOAK_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
    volumes:
      - ./infra/keycloak/gsttool-realm.json:/opt/keycloak/data/import/gsttool-realm.json:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_DOMAIN}`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.routers.keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  # ==================== API GATEWAY ====================
  
  kong:
    image: kong:3.3
    container_name: gst-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8002
      KONG_PLUGINS: bundled,jwt
      KONG_LOG_LEVEL: info
    volumes:
      - ./services/api-gateway/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      - "8002:8002"   # published for local/tunnel access (Traefik still the prod entrypoint)
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kong.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.kong.entrypoints=websecure"
      - "traefik.http.routers.kong.tls=true"
      - "traefik.http.routers.kong.tls.certresolver=letsencrypt"
      - "traefik.http.services.kong.loadbalancer.server.port=8002"

  # ==================== STORAGE & CACHE ====================
  
  minio:
    image: minio/minio:latest
    container_name: gst-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - gst-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`${MINIO_DOMAIN}`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.tls=true"
      - "traefik.http.routers.minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"

  nats:
    image: nats:2.10
    container_name: gst-nats
    restart: unless-stopped
    command: -js -m 8222
    networks:
      - gst-network

  # ==================== EMAIL TESTING ====================
  
  mailhog:
    image: mailhog/mailhog:latest
    container_name: gst-mailhog
    restart: unless-stopped
    networks:
      - gst-network

  # ==================== MICROSERVICES ====================
  
  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-services/Dockerfile
    container_name: gst-tenant-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - NATS_URL=nats://nats:4222
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=gsttool
      - KEYCLOAK_CLIENT_ID=admin-api
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - KEYCLOAK_PUBLIC_KEY=${KEYCLOAK_PUBLIC_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
    command: npm run dev
    volumes:
      - ./services/tenant-services/src:/app/services/tenant-services/src
      - ./services/shared:/app/services/shared
      - /app/services/shared/node_modules
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  workspace-service:
    build:
      context: .
      dockerfile: services/workspace-service/Dockerfile
    container_name: gst-workspace-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=gsttool
      - KEYCLOAK_CLIENT_ID=admin-api
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_PUBLIC_KEY=${KEYCLOAK_PUBLIC_KEY}
      - NATS_URL=nats://nats:4222
      - PORT=3002
      - EXT_API_URL=http://gsp_api_app:4015
    command: npm run dev
    volumes:
      - ./services/workspace-service/src:/app/services/workspace-service/src
      - ./services/shared:/app/services/shared
      - /app/services/shared/node_modules
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  gstn-service:
    build:
      context: .
      dockerfile: services/gstn-service/Dockerfile
    container_name: gst-gstn-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - KEYCLOAK_PUBLIC_KEY=${KEYCLOAK_PUBLIC_KEY}
      - NATS_URL=nats://nats:4222
      - PORT=3003
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  upload-service:
    build:
      context: .
      dockerfile: services/upload-service/Dockerfile
    container_name: gst-upload-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - KEYCLOAK_PUBLIC_KEY=${KEYCLOAK_PUBLIC_KEY}
      - NATS_URL=nats://nats:4222
      - PORT=3004
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_USE_SSL=false
      - MINIO_BUCKET=gst-documents
    command: npm run dev
    volumes:
      - ./uploads:/app/uploads
      - ./services/upload-service/src:/app/services/upload-service/src
      - ./services/shared:/app/services/shared
      - /app/services/shared/node_modules
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3004/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  report-service:
    build:
      context: .
      dockerfile: services/report-services/Dockerfile
    container_name: gst-report-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - KEYCLOAK_PUBLIC_KEY=${KEYCLOAK_PUBLIC_KEY}
      - NATS_URL=nats://nats:4222
      - PORT=3005
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3005/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
 
  json-import-service:
    build:
      context: .
      dockerfile: services/json-import-service/Dockerfile
    container_name: gst-json-import-service
    restart: unless-stopped
    depends_on:
      postgres-main:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - KEYCLOAK_PUBLIC_KEY=${KEYCLOAK_PUBLIC_KEY}
      - NATS_URL=nats://nats:4222
      - PORT=3007
    command: npm run dev
    volumes:
      - ./services/json-import-service/src:/app/services/json-import-service/src
      - ./services/shared:/app/services/shared
      - /app/services/shared/node_modules
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3007/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  notification-service:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    container_name: gst-notification-service
    restart: unless-stopped
    depends_on:
      nats:
        condition: service_started
      mailhog:
        condition: service_started
    environment:
      - NATS_URL=nats://nats:4222
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - DB_HOST=postgres-main
      - DB_NAME=${POSTGRES_MAIN_DB}
      - DB_USER=${POSTGRES_MAIN_USER}
      - DB_PASSWORD=${POSTGRES_MAIN_PASSWORD}
      - KEYCLOAK_PUBLIC_KEY=${KEYCLOAK_PUBLIC_KEY}
      - PORT=3006
    command: npm run dev
    volumes:
      - ./services/notification/src:/app/services/notification/src
      - ./services/shared:/app/services/shared
      - /app/services/shared/node_modules
    networks:
      - gst-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3006/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  recon-frontend:
    build:
      context: ../recon_frontend
      dockerfile: Dockerfile
    container_name: gst-recon-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - gst-network
volumes:
  postgres_main_data:
  postgres_keycloak_data:
  minio_data:

networks:
  gst-network:
    driver: bridge